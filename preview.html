<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Screenshot Preview</title>
  <link rel="stylesheet" href="preview.css" />
</head>
<body>
  <main class="preview-shell">
    <header class="preview-header">
      <h1 class="preview-title">Screenshot Preview</h1>
      <p class="preview-name" id="previewName"></p>
    </header>
    <section class="preview-stage" id="previewStage">
      <p class="preview-status" id="previewStatus">Loading screenshot...</p>
      <img id="previewImage" alt="Screenshot preview" hidden />
    </section>
  </main>
  <script src="extension-api.js"></script>
  <script src="preview.js"></script>
</body>
</html>
